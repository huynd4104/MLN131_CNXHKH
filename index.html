<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vũ trụ tri thức Chủ nghĩa xã hội khoa học - MLN131 Cosmic Knowledge Exhibition</title>
    <meta name="description" content="Trải nghiệm khám phá vũ trụ tri thức Chủ nghĩa xã hội khoa học MLN131 qua 7 hành tinh lý luận.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div class="scroll-progress-container" aria-hidden="true">
        <div class="scroll-progress" id="scrollProgressBar"></div>
    </div>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <div class="app-shell">
        <aside class="app-nav" aria-label="Điều hướng chính">
            <a href="#" class="brand-mark" data-tab="overview" aria-label="Triển lãm Vũ trụ MLN131">
                <span class="brand-icon"><i class="fa-solid fa-shuttle-space"></i></span>
                <span class="brand-copy">
                    <strong>MLN131</strong>
                    <small>Triển lãm Vũ trụ</small>
                </span>
            </a>

            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-tab="overview">
                    <i class="fa-solid fa-compass"></i>
                    <span>Hành trình</span>
                </a>
                <a href="#" class="nav-item" data-tab="chapters">
                    <i class="fa-solid fa-globe"></i>
                    <span>Hành tinh</span>
                </a>
                <a href="#" class="nav-item" data-tab="flashcards">
                    <i class="fa-solid fa-microchip"></i>
                    <span>Thẻ nhớ</span>
                </a>
                <a href="#" class="nav-item" data-tab="quiz">
                    <i class="fa-solid fa-circle-question"></i>
                    <span>Quiz</span>
                </a>
                <a href="#" class="nav-item" data-tab="review">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Ôn nhanh</span>
                </a>
                <a href="#" class="nav-item" data-tab="glossary">
                    <i class="fa-solid fa-satellite"></i>
                    <span>Tra cứu</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-title">
                    <p class="eyebrow" id="pageEyebrow">Chủ nghĩa xã hội khoa học</p>
                    <h1 id="pageTitle">Vũ trụ tri thức</h1>
                    <p id="pageSubtitle">Hành trình khám phá 7 trạm tri thức xã hội.</p>
                </div>
                <div class="header-actions">
                    <label class="search-control" for="globalSearch">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="search" id="globalSearch" placeholder="Tìm thuật ngữ, chương học...">
                    </label>
                    <button class="icon-button" id="themeToggleBtn" type="button" title="Đổi giao diện" aria-label="Đổi giao diện">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="tab-content">
                <section class="tab-pane active" id="overview" aria-label="Hành trình học tập"></section>
                <section class="tab-pane" id="chapters" aria-label="7 chương học"></section>
                <section class="tab-pane" id="flashcards" aria-label="Flashcards thuật ngữ"></section>
                <section class="tab-pane" id="quiz" aria-label="Quiz ôn tập"></section>
                <section class="tab-pane" id="review" aria-label="Ôn thi nhanh"></section>
                <section class="tab-pane" id="glossary" aria-label="Tra cứu thuật ngữ"></section>
            </div>
        </main>
    </div>

    <button class="back-to-top" id="backToTopBtn" type="button" title="Về đầu trang" aria-label="Về đầu trang">
        <i class="fa-solid fa-chevron-up"></i>
    </button>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
